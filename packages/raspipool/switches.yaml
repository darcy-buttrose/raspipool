input_boolean:
  lock_bleach:
    initial: off
    icon: mdi:lock
  lock_muriatic:
    initial: off
    icon: mdi:lock


template:
  - binary_sensor:
      - name: bleach
        device_class: plug
        state: "{{ is_state('switch.orp', 'on') }}"
        icon: >-
          {% if is_state('input_boolean.lock_bleach', 'on') %}
            mdi:lock
          {% endif %}
      - name: muriatic
        device_class: plug
        state: "{{ is_state('switch.ph', 'on') }}"
        icon: >-
          {% if is_state('input_boolean.lock_muriatic', 'on') %}
            mdi:lock
          {% endif %}
